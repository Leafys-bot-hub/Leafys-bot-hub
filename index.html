<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Hub</title>
<meta name="description" content="One place to open every bot dashboard and see whether each bot is online.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<style>
  :root{--bg:#0b0f14;--panel:rgba(255,255,255,.04);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--fg:#eef2f6;--muted:#8a94a6;--green:#3ddc84;--red:#ff5c6c;--yellow:#ffc857;--r:18px}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 500px at -10% -10%,rgba(45,212,191,.16),transparent 60%),radial-gradient(700px 400px at 110% 10%,rgba(246,166,35,.14),transparent 60%),radial-gradient(600px 400px at 50% 120%,rgba(109,140,255,.1),transparent 60%);background-attachment:fixed}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 16px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:28px}
  header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.4px}
  header p{margin:0;color:var(--muted)}
  header .sp{flex:1}
  .refresh{background:var(--panel2);border:1px solid var(--line2);color:var(--fg);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  .refresh:hover{border-color:var(--line2);filter:brightness(1.1)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
  .bot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s,border-color .15s;overflow:hidden}
  .bot:hover{transform:translateY(-2px);border-color:var(--line2)}
  .bot:before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c1),var(--c2))}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#04141a;flex-shrink:0;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .name{font-size:19px;font-weight:800;letter-spacing:-.2px}
  .desc{color:var(--muted);font-size:13.5px}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:6px 0 14px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  .on .dot{background:var(--green);box-shadow:0 0 0 3px rgba(61,220,132,.2),0 0 12px rgba(61,220,132,.6)}
  .off .dot{background:var(--red);box-shadow:0 0 0 3px rgba(255,92,108,.2)}
  .wait .dot{background:var(--yellow);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;min-height:26px}
  .stats span{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
  .stats span b{color:var(--fg);font-weight:700}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;min-width:150px;white-space:nowrap;text-align:center;padding:11px 14px;border-radius:12px;font-weight:700;background:linear-gradient(135deg,var(--c1),var(--c2));color:#04141a;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:filter .15s,transform .12s}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.sec{background:var(--panel2);border:1px solid var(--line2);color:var(--fg);box-shadow:none;flex:0 1 auto}
  .foot{margin-top:28px;color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .foot code{background:rgba(0,0,0,.35);border:1px solid var(--line);padding:2px 7px;border-radius:6px;font-size:12px}
  @media(max-width:520px){.wrap{padding:24px 16px 48px}header h1{font-size:24px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>🛰️ Bot Hub</h1><p>Every dashboard in one place. Status checks run from your browser.</p></div>
    <span class="sp"></span>
    <button class="refresh" id="refresh">↻ Refresh</button>
  </header>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <span>Last checked: <b id="last">—</b></span>
    <span>Auto-refreshes every 60 s.</span>
    <span>To add a bot, edit the <code>BOTS</code> list at the bottom of <code>index.html</code>.</span>
  </div>
</div>
<script>
// ======================= EDIT THIS LIST =======================
// url   = the bot's public address (no trailing slash)
// Every bot built with the same template exposes /dashboard, /status and /health.
const BOTS = [
  { name: 'MailDesk', emoji: '📬', desc: 'ModMail — departments, certified staff, snippets, tests', url: 'https://ce30bbdyvw.apps.bot-hosting.cloud', colors: ['#f6a623', '#ff6b8b'] },
  { name: 'StaffHub', emoji: '🧑‍💼', desc: 'Staff utility — applications, verification, roster, strikes, breaks', url: 'https://hr18o67l0z.apps.bot-hosting.cloud', colors: ['#2dd4bf', '#6d8cff'] },
  // { name: 'ChannelMap', emoji: '🗺️', desc: 'Channel roadmap', url: 'https://xxxx.apps.bot-hosting.cloud', colors: ['#b48cff', '#6d8cff'] },
];
// ==============================================================

const grid = document.getElementById('grid');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtUp = (s) => { s = Math.floor(s || 0); const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; };

function render() {
  grid.innerHTML = BOTS.map((b, i) => `
  <article class="bot wait" id="bot${i}" style="--c1:${b.colors[0]};--c2:${b.colors[1]}">
    <div class="head"><div class="icon">${b.emoji}</div><div><div class="name">${esc(b.name)}</div><div class="desc">${esc(b.desc)}</div></div></div>
    <div class="status"><span class="dot"></span><span class="txt">Checking…</span></div>
    <div class="stats"></div>
    <div class="btns"><a class="btn" href="${b.url}/dashboard" target="_blank" rel="noopener">Open dashboard</a><a class="btn sec" href="${b.url}/status" target="_blank" rel="noopener">Status page</a></div>
  </article>`).join('');
}

async function check(b, i) {
  const el = document.getElementById('bot' + i);
  const txt = el.querySelector('.txt'), stats = el.querySelector('.stats');
  el.className = 'bot wait';
  txt.textContent = 'Checking…';
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 8000);
  try {
    // Preferred: read /health (needs the bot to send CORS headers — new builds do).
    const r = await fetch(b.url + '/health?t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' });
    const j = await r.json();
    const ready = j.ready !== false;
    el.className = 'bot ' + (ready ? 'on' : 'off');
    txt.textContent = ready ? 'Online' : 'Web server up, Discord not connected';
    const parts = [];
    if (j.uptime != null) parts.push(`up <b>${fmtUp(j.uptime)}</b>`);
    if (j.guilds != null) parts.push(`<b>${j.guilds}</b> server${j.guilds === 1 ? '' : 's'}`);
    if (j.openThreads != null) parts.push(`<b>${j.openThreads}</b> open thread${j.openThreads === 1 ? '' : 's'}`);
    if (j.teams != null) parts.push(`<b>${j.teams}</b> linked team${j.teams === 1 ? '' : 's'}`);
    if (j.storage) parts.push(/Local file/i.test(j.storage) ? '⚠️ storage not set' : `💾 ${esc(j.storage.split(' ')[0])}`);
    stats.innerHTML = parts.map((p) => `<span>${p}</span>`).join('');
  } catch (e) {
    // Fallback: an opaque ping tells us only whether the server answers at all.
    try {
      await fetch(b.url + '/health?t=' + Date.now(), { mode: 'no-cors', signal: ctl.signal, cache: 'no-store' });
      el.className = 'bot on';
      txt.textContent = 'Reachable';
      stats.innerHTML = '<span>Details hidden — update the bot for live stats</span>';
    } catch {
      el.className = 'bot off';
      txt.textContent = 'Offline / unreachable';
      stats.innerHTML = '';
    }
  } finally { clearTimeout(timer); }
}

async function checkAll() {
  await Promise.all(BOTS.map(check));
  document.getElementById('last').textContent = new Date().toLocaleTimeString();
}
render();
checkAll();
document.getElementById('refresh').addEventListener('click', checkAll);
setInterval(checkAll, 60_000);
</script>
</body>
</html>
